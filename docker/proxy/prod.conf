server {
    listen VPN_ADDRESS:443 ssl;
    server_name _;
    ssl_certificate /run/kokpit/certificates/panel.crt;
    ssl_certificate_key /run/kokpit/certificates/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /app/public;
    access_log off;
    # nginx diagnostics can include the enrolment token in the request URI.
    error_log /dev/null;
    server_tokens off;
    location /ntfy/ { proxy_pass http://ntfy/; proxy_http_version 1.1; proxy_set_header Host $host; }
    location / { try_files $uri /index.php$is_args$args; }
    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        internal;
    }
    location ~ \.php$ { return 404; }
}
