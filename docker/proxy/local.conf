server {
    listen 80;
    server_name localhost;
    root /app/public;
    access_log off;
    # nginx diagnostics can include the enrolment token in the request URI.
    error_log /dev/null;
    server_tokens off;
    location / { try_files $uri /index.php$is_args$args; }
    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTP_PROXY "";
        # Czat odpowiada w synchronicznym żądaniu: chat.max_iterations × chat.timeout_s + 60 s zapasu (D-61).
        fastcgi_read_timeout 780s;
        internal;
    }
    location ~ \.php$ { return 404; }
}
