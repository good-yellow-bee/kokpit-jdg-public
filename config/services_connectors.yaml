parameters:
  app.dummy.default_endpoint: 'https://dummy.invalid/call'
  app.connectors.default_enabled: false
  app.connectors.default_target: test
  app.push.default_endpoint: 'http://ntfy/kokpit'
  app.mail.default_host: 'smtp.example.invalid'
  app.deadman.default_host: 'hc-ping.com'
  app.mail.default_from: 'kokpit@example.invalid'
  app.mail.default_to: 'owner@example.invalid'
  app.default_deployment: dev
  app.panel.default_origin: 'http://localhost'
  app.panel.default_certificate: '/run/kokpit/certificates/panel.crt'
  connector.daily_limits: { jpk.init_upload: 10, dummy.call: 10000, push.send: 250, mail.send: 100, deadman.ping: 500, nbp.rates: 200, white_list.search: 80, white_list.check: 4000 }
  # Adresy rejestrów per środowisko (docs/modules/rejestry-kursy.md); poza PROD tylko usługi testowe.
  registry.vies_endpoints: { test: 'https://ec.europa.eu/taxation_customs/vies/rest-api/check-vat-test-service', prod: 'https://ec.europa.eu/taxation_customs/vies/rest-api/check-vat-number' }
  registry.white_list_endpoints: { test: 'https://wykazpodatnikowvat-test.mf.gov.pl/api', prod: 'https://wykazpodatnikowvat.mf.gov.pl/api' }
  # Odstępy ponowień VIES po przeciążeniu, w sekundach; po 24 h od pierwszej próby alert connector_failure.
  registry.vies_retry_delays: [900, 1800, 3600, 7200, 14400, 28800]
  # Latarnia KSeF per cel (docs/modules/ksef.md, „Awarie KSeF i Latarnia”); DEMO nie ma Latarni.
  latarnia.endpoints: { test: 'https://api-latarnia-test.ksef.mf.gov.pl', prod: 'https://api-latarnia.ksef.mf.gov.pl' }
  # Konektor `jpk` (F5.1, docs/modules/jpk.md): API JPK 5.6.0 per cel, metadane `InitUpload`, części pliku, TLS i
  # certyfikat klucza publicznego MF per cel (plik poza repo, odświeża go `mf_keys.refresh`).
  jpk.endpoints: { test: 'https://test-e-dokumenty.mf.gov.pl/api/Storage/', prod: 'https://e-dokumenty.mf.gov.pl/api/Storage/' }
  jpk.init_upload: { document_type: JPK, version: '01.02.01.20160617', max_bytes: 102400 }
  jpk.part_max_bytes: 62914560
  # Cztery zestawy TLS 1.2 z listy sześciu; dwa zestawy TLS 1.3 (TLS_AES_*_GCM) to domyślne OpenSSL, `ciphers` ich nie
  # ustawia. Wynegocjowany zestaw sprawdza `jpk-te-tls` w F5.3 (D-57).
  jpk.tls_ciphers: 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256'
  jpk.mf_certificates: { test: '%kernel.project_dir%/var/jpk/mf-test.crt', prod: '%kernel.project_dir%/var/jpk/mf-prod.crt' }
  # Konektor `claude` (F6.2, D-60): jeden host, timeout z `chat.timeout_s`, bez ponowień SDK.
  claude.base_url: 'https://api.anthropic.com'
services:
  _defaults: { autowire: true, autoconfigure: true }
  App\Config\ConnectorConfiguration:
    arguments:
      $appEnvironment: '%kernel.environment%'
      $deployment: '%env(default:app.default_deployment:KOKPIT_DEPLOYMENT)%'
      $enabled: '%env(bool:default:app.connectors.default_enabled:CONNECTORS_ENABLED)%'
      $ksefTarget: '%env(default:app.connectors.default_target:KSEF_TARGET)%'
      $jpkTarget: '%env(default:app.connectors.default_target:JPK_TARGET)%'
      $edeklaracjeTarget: '%env(default:app.connectors.default_target:EDEKLARACJE_TARGET)%'
      $pushEndpoint: '%env(default:app.push.default_endpoint:PUSH_ENDPOINT)%'
      $mailHost: '%env(default:app.mail.default_host:MAIL_HOST)%'
      $deadmanHost: '%env(default:app.deadman.default_host:DEADMAN_HOST)%'
      $dailyLimits: '%connector.daily_limits%'
  App\Scheduler\DefaultScheduleProvider:
    arguments: { $schedulerState: '@cache.scheduler' }
  App\Scheduler\HeartbeatStore:
    arguments: { $schedulerState: '@cache.scheduler' }
  App\Messenger\FailedMessageNotifier:
    arguments: { $failed: '@messenger.transport.failed' }
  App\Messenger\RateLimitDeferralMiddleware:
    arguments: { $reads: '@messenger.transport.reads', $notifications: '@messenger.transport.notifications' }
  App\Rate\RateCounter:
    arguments: { $dailyLimits: '%connector.daily_limits%' }
  App\Http\HostAllowlist:
    decorates: http_client
    arguments:
      $hosts: !php/const App\Config\ConnectorHosts::HOSTS
      $client: '@App\Http\HostAllowlist.inner'
  App\Http\ConnectorHttpClient:
    arguments:
      $httpClient: '@http_client'
      $enabled: '%env(bool:default:app.connectors.default_enabled:CONNECTORS_ENABLED)%'
  App\Connector\Mail\GuardedMailTransport:
    arguments: { $transport: null }
  App\Connector\Push\PushNotifier: ~
  App\Connector\Mail\MailNotifier:
    arguments:
      $from: '%env(default:app.mail.default_from:MAIL_FROM)%'
      $to: '%env(default:app.mail.default_to:MAIL_TO)%'
  App\Connector\DeadMan\DeadManNotifier: ~
  App\Connector\Nbp\NbpConnector: ~
  App\Fx\NbpRateSource: '@App\Connector\Nbp\NbpConnector'
  App\Connector\Ksef\UnavailableKsefGateway: ~
  App\Connector\Ksef\KsefGateway: '@App\Connector\Ksef\UnavailableKsefGateway'
  # Konektor zapisu KSeF (F3.3): `OfficialWriter` i `StatusReader`; wysyła tylko `OfficialWritesHandler`.
  App\Connector\Ksef\KsefWriter:
    arguments: { $formCode: '%ksef.form_code%' }
  App\Connector\Latarnia\LatarniaConnector:
    arguments: { $endpoints: '%latarnia.endpoints%' }
  # Konektor zapisu JPK (F5.1): `OfficialWriter` i `StatusReader`; wysyła tylko `OfficialWritesHandler`.
  App\Connector\Jpk\JpkGateway:
    arguments: { $endpoints: '%jpk.endpoints%', $cryptoMethod: !php/const STREAM_CRYPTO_METHOD_TLSv1_2_CLIENT, $ciphers: '%jpk.tls_ciphers%' }
  App\Connector\Jpk\JpkEnvelope:
    arguments: { $partMaxBytes: '%jpk.part_max_bytes%' }
  App\Connector\Jpk\JpkInitUpload:
    arguments: { $settings: '%jpk.init_upload%' }
  App\Connector\Jpk\JpkMfCertificate:
    arguments: { $paths: '%jpk.mf_certificates%' }
  App\Connector\Jpk\AuthDataDocument: ~
  App\Connector\Jpk\JpkWriter: ~
  App\Connector\Latarnia\LatarniaStatusStore:
    arguments: { $schedulerState: '@cache.scheduler' }
  App\Connector\Latarnia\LatarniaStatusHandler: ~
  App\Connector\FreshBooks\FreshBooksOAuth: ~
  App\Connector\FreshBooks\FreshBooksConnector: ~
  App\Connector\FreshBooks\FreshBooksSync: ~
  App\Connector\FreshBooks\FreshBooksPollHandler: ~
  App\Connector\Vies\ViesConnector:
    arguments: { $endpoints: '%registry.vies_endpoints%' }
  App\Connector\WhiteList\WhiteListConnector:
    arguments: { $endpoints: '%registry.white_list_endpoints%' }
  App\Counterparty\CounterpartyVerifier:
    arguments: { $viesRetryDelays: '%registry.vies_retry_delays%' }
  App\Connector\Claude\ChatRequestProfile:
    arguments: { $model: '%chat.model%', $effort: '%chat.effort%', $maxTokens: '%chat.max_tokens%' }
  App\Connector\Claude\ClaudeClientFactory:
    arguments: { $baseUrl: '%claude.base_url%', $timeoutSeconds: '%chat.timeout_s%' }
  App\Connector\Claude\ClaudeMessages: ~
when@dev:
  services:
    dummy.mock_response:
      class: Symfony\Component\HttpClient\Response\MockResponse
      arguments: ['{"status":"ok","fictional":true}']
    dummy.mock_http_client:
      class: Symfony\Component\HttpClient\MockHttpClient
      arguments: ['@dummy.mock_response', 'https://dummy.invalid']
    dummy.host_allowlist:
      class: App\Http\HostAllowlist
      autowire: true
      arguments:
        $hosts: !php/const App\Config\ConnectorHosts::HOSTS
        $client: '@dummy.mock_http_client'
    dummy.http_client:
      class: App\Http\ConnectorHttpClient
      autowire: true
      arguments:
        $httpClient: '@dummy.host_allowlist'
        $enabled: '%env(bool:default:app.connectors.default_enabled:CONNECTORS_ENABLED)%'
    App\Connector\Dummy\DummyConnector:
      autowire: true
      autoconfigure: true
      arguments: { $http: '@dummy.http_client', $endpoint: '%app.dummy.default_endpoint%' }
    App\Connector\Dummy\DummySubjects: ~
    App\Connector\Dummy\DummyWriter:
      autowire: true
      autoconfigure: true
      arguments: { $http: '@dummy.http_client', $baseUrl: 'https://dummy.invalid' }
    # Atrapa `filing` bez własnego tagu: obsługuje ją `filing.subject` dla id bez wiersza `filing` (F5.1).
    dummy.subject.filing:
      class: App\Connector\Dummy\DummySubject
      autowire: true
      autoconfigure: false
      arguments: { $subjectType: filing }
    filing.subject:
      class: App\Ledger\FilingSubject
      autowire: true
      autoconfigure: true
      arguments: { $fallback: '@dummy.subject.filing' }
    dummy.subject.draft:
      class: App\Connector\Dummy\DummySubject
      autowire: true
      autoconfigure: true
      arguments: { $subjectType: draft }
