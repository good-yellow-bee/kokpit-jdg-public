webauthn:
  credential_repository: App\Passkey\WebauthnRepository
  user_repository: App\Passkey\WebauthnRepository
  allowed_origins:
    panel: '%env(default:app.panel.default_origin:PANEL_ORIGIN)%'
  creation_profiles:
    panel:
      rp: { name: 'Kokpit JDG' }
      authenticator_selection_criteria:
        user_verification: required
        resident_key: preferred
    # Klucz FIDO2 jako drugi passkey (D-90): `cross-platform` filtruje do kluczy USB/NFC/BLE; bez wpisu rezydentnego,
    # bo logowanie podaje `allowCredentials` z bazy, a klucze mają mało miejsca na wpisy.
    security_key:
      rp: { name: 'Kokpit JDG' }
      authenticator_selection_criteria:
        authenticator_attachment: cross-platform
        user_verification: required
        resident_key: discouraged
  request_profiles:
    panel:
      user_verification: required
  controllers:
    creation:
      enrolment:
        options_path: /passkey/enrol/options
        result_path: /passkey/enrol/result
        profile: panel
        user_entity_guesser: App\Passkey\EnrollmentUserEntityGuesser
      enrolment_security_key:
        options_path: /passkey/enrol/security-key/options
        result_path: /passkey/enrol/security-key/result
        profile: security_key
        user_entity_guesser: App\Passkey\EnrollmentUserEntityGuesser
  passkey_endpoints:
    enabled: true
    enroll: '/passkey/enrol'
