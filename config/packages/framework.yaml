framework:
  secret: '%env(APP_SECRET)%'
  secrets:
    vault_directory: '%env(VAULT_DIRECTORY)%/%kernel.environment%'
  http_client: ~
  asset_mapper:
    paths: { '%kernel.project_dir%/assets/': '' }
    # Bez polyfillu es-module-shims z CDN (D-73): przeglądarki panelu znają importmap.
    importmap_polyfill: false
  property_info: { with_constructor_extractor: true }
  serializer: { enabled: true }
  csrf_protection: true
  session:
    handler_id: null
    cookie_secure: true
    cookie_httponly: true
    cookie_samesite: strict
    gc_maxlifetime: 1800
  router: { utf8: true }
  php_errors: { log: true }
  # Stany szkicu czatu (docs/modules/czat.md, „Stany szkicu”; F6.4, D-62): przejścia wywołuje `DraftSubject` po zmianie `approval.status`.
  workflows:
    draft:
      type: state_machine
      marking_store: { type: method, property: status }
      supports: [App\Chat\DraftState]
      initial_marking: pending
      places: [pending, approved, discarded, executed]
      transitions:
        approve: { from: pending, to: approved }
        reopen: { from: approved, to: pending }
        execute: { from: approved, to: executed }
        discard: { from: [pending, approved], to: discarded }
when@test:
  framework:
    test: true
    session: { storage_factory_id: session.storage.factory.mock_file }
