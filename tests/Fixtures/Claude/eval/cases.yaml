# Zestaw ewaluacyjny czatu (D-114): pytania z oczekiwanymi wywołaniami narzędzi i liczbami na fikcyjnym zbiorze
# `ChatEvalRunner::seed` (dane fikcyjne, fictional; zegar 2026-10-14). Pola przypadku:
# - `tools`: wywołania, które muszą się udać; `input` to podzbiór pól porównywany dokładnie; `step` = numer odpowiedzi
#   w ręcznie pisanym nagraniu (domyślnie 1);
# - `no_tools`: żadne narzędzie nie może zwrócić wyniku bez `is_error`;
# - `replay`: wywołania tylko z ręcznie pisanego nagrania; gdy padną, executor musi je odrzucić z `error`;
# - `numbers`: liczby, które muszą być w wynikach narzędzi albo w snapshocie prawa i w odpowiedzi.
# Każde pytanie ma jawną datę, bo model w przebiegu live nie zna „dziś” zbioru.
