name: CI
on:
  # Gałąź PR uruchamia CI raz, przez pull_request; push tylko na main (D-43).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      phase:
        description: Faza do testu live (np. f0a)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  KOKPIT_DEPLOYMENT: dev
  APP_ENV: test
  CONNECTORS_ENABLED: '0'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/ci-bootstrap.sh
      - run: docker compose exec -T app vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: docker compose exec -T app vendor/bin/phpstan analyse
      - run: docker compose exec -T app composer check-licenses
      # Znane podatności zależności z composer.lock (D-77).
      - run: docker compose exec -T app composer audit --locked
      # SBOM CycloneDX z composer.lock i importmap.php jako artefakt przebiegu (D-78).
      - run: docker compose exec -T app php tools/sbom.php "$GITHUB_SHA" > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
      - run: docker compose exec -T app composer fixtures:scan
  unit_property:
    name: unit+property
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/ci-bootstrap.sh
      - run: docker compose exec -T app vendor/bin/phpunit --testsuite unit --fail-on-empty-test-suite
      - run: docker compose exec -T app vendor/bin/phpunit --testsuite property --fail-on-empty-test-suite
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/ci-bootstrap.sh
      - run: docker compose exec -T app vendor/bin/phpunit --testsuite contract --fail-on-empty-test-suite
  xsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/ci-bootstrap.sh
      - run: docker compose exec -T app vendor/bin/phpunit --testsuite xsd --fail-on-empty-test-suite
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/ci-bootstrap.sh
      - run: docker compose exec -T app vendor/bin/phpunit --testsuite integration --fail-on-empty-test-suite
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/ci-bootstrap.sh
      - run: docker compose exec -T app vendor/bin/phpunit --testsuite security --fail-on-empty-test-suite
  # Kanał aktualizacji (D-93): obrazy `production` i `proxy` budowane przy każdym PR; push do GHCR i podpis bez klucza
  # (Sigstore, OIDC tego przebiegu) tylko z push do main, po zielonych testach. `make deploy` sprawdza ten podpis.
  images:
    if: github.event_name != 'workflow_dispatch'
    needs: [lint, unit_property, contract, xsd, integration, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      REGISTRY: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - run: cosign version
      - run: |
          for target in production:app proxy:proxy; do
            docker build --target "${target%%:*}" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$REGISTRY/${target##*:}:$GITHUB_SHA" .
          done
      - if: env.PUBLISH == 'true'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for image in app proxy; do
            docker push --quiet "$REGISTRY/$image:$GITHUB_SHA"
            cosign sign --yes "$(docker image inspect "$REGISTRY/$image:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')"
          done
      # Ta sama weryfikacja co w `make deploy`: tożsamość przebiegu, commit i wyzwalacz push.
      - if: env.PUBLISH == 'true'
        run: make verify-images KOKPIT_COMMIT="$GITHUB_SHA"
  mutation:
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/ci-bootstrap.sh
      - run: docker compose exec -T app sh scripts/run-mutation.sh | tee mutation.txt
      - run: cat mutation.txt >> "$GITHUB_STEP_SUMMARY"
  evidence:
    if: (github.event_name != 'push' || github.ref_name != 'main') && (github.event_name == 'workflow_dispatch' || startsWith(github.head_ref || github.ref_name, 'f'))
    needs: [lint, unit_property, contract, xsd, integration, security]
    env:
      SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      DISPATCH_PHASE: ${{ inputs.phase }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/ci-bootstrap.sh
      - run: sh scripts/ci-evidence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: var/evidence/**
          if-no-files-found: error
  live:
    if: github.event_name == 'workflow_dispatch'
    env:
      SOURCE_BRANCH: ${{ github.ref_name }}
      DISPATCH_PHASE: ${{ inputs.phase }}
      EVIDENCE_RUNNER: live
      # Budżet przebiegu live konektora `claude` w USD (`chat.live_run_budget_usd`, D-60); bez niego bootstrap odmawia.
      CHAT_LIVE_RUN_BUDGET_USD: '0.25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/ci-bootstrap.sh
      # Certyfikat testowy MF dla testów JPK live ze zmiennej repozytorium (D-97); bez niego job kończy się przed testami.
      - env:
          MF_TEST_CERT_PEM: ${{ vars.MF_TEST_CERT_PEM }}
        run: sh scripts/ci-mf-test-cert.sh
      - run: docker compose exec -T -e CONNECTORS_ENABLED=1 -e CHAT_LIVE_RUN_BUDGET_USD app vendor/bin/phpunit --testsuite live --fail-on-empty-test-suite
      - run: sh scripts/ci-evidence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-evidence
          path: var/evidence/**
          if-no-files-found: error
